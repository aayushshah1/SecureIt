spring.application.name=pmbackend

# Database configuration - Docker service names
spring.datasource.url=jdbc:mysql://mysql:3306/password_manager
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server configuration
server.port=8080

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Eureka client configuration - Docker service names
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=pmbackend

# Security settings

# Password encryption secret
password.encryption.secret=${PASSWORD_ENCRYPTION_SECRET:default-secret-key-for-development}

# Auth server configuration - Docker service name
auth.server.url=http://auth-server:8081

# CORS allowed origins - Docker client hostname
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://client,http://localhost:3000}

# Logging configuration
logging.level.com.msaproject.pmbackend=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.transaction=INFO
logging.level.org.springframework.security=INFO
