spring.application.name=pmbackend
# Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/password_manager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server configuration
server.port=8080

# Actuator configuration - using specific endpoints with valid chars
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Eureka client configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Security settings

# Password encryption secret
password.encryption.secret=${PASSWORD_ENCRYPTION_SECRET:default-secret-key-for-development}

# Auth server configuration
# Default to the Kubernetes service name and port. Can be overridden by AUTH_SERVER_URL env var.
auth.server.url=${AUTH_SERVER_URL:http://localhost:8081}

# CORS allowed origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging configuration
logging.level.com.msaproject.pmbackend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.security=INFO