spring.application.name=api-gateway

# Server configuration
server.port=8000

# Eureka configuration for service discovery
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost

# CORS Configuration - MUST be enabled BEFORE routes
# cors.allowed.origins=${API_GATEWAY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://client,http://localhost}
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${cors.allowed.origins}
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,HEAD
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
# spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=*
# spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
# spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600
# spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# Spring Cloud Gateway Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AuthServer
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/auth/(?<segment>.*), /api/auth/$\{segment}

spring.cloud.gateway.routes[1].id=password-service
spring.cloud.gateway.routes[1].uri=lb://pmbackend
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/passwords/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/passwords/(?<segment>.*), /api/passwords/$\{segment}

# Enable discovery locator for dynamic routing
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.discovery.locator.include-expression=metadata['cloud.gateway.enabled'] != 'false'

# Actuator configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Logging configuration
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=INFO
