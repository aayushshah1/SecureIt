# ConfigMap for Spring Boot application properties
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-server-config
data:
  # Spring Boot configuration properties
  application.properties: |
    spring.application.name=AuthServer

    # Database configuration
      spring.datasource.url=jdbc:mysql://mysql:3306/password_manager
      spring.datasource.username=root
      spring.datasource.password=test@123
      spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
      spring.jpa.hibernate.ddl-auto=update
      spring.jpa.show-sql=true

      # Server configuration
      server.port=8081

      # Actuator configuration
      management.endpoints.web.exposure.include=*
      management.endpoint.health.show-details=always
      management.endpoint.prometheus.enabled=true
      management.metrics.export.prometheus.enabled=true

      # Eureka client configuration
      eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
      eureka.instance.prefer-ip-address=true
      eureka.instance.appname=auth-server


      jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      jwt.expiration=86400000
      # Security settings

      # Auth server configuration
      # Default to the Kubernetes service name and port. Can be overridden by AUTH_SERVER_URL env var.
      # Logging configuration
      logging.level.com.msaproject.pmauth-server=DEBUG
      logging.level.org.hibernate.SQL=DEBUG
      logging.level.org.springframework.transaction=DEBUG
      logging.level.org.springframework.security=INFO
---
# auth-server Spring Boot Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
spec:
  # Pod selector matching
  selector:
    matchLabels:
      app: auth-server
  replicas: 1
  template:
    metadata:
      labels:
        app: auth-server
    spec:
      containers:
        - name: auth-server
          image: pmauth-server:latest
          imagePullPolicy: Never # For local development
          ports:
            - containerPort: 8081 # Spring Boot application port
          # Environment configuration
          env:
            - name: SPRING_CONFIG_LOCATION
              value: "/app/config/application.properties"
          # Mount ConfigMap as a file
          volumeMounts:
            - name: config-volume
              mountPath: /app/config/application.properties
              subPath: application.properties
          # Health check
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10 # Wait before first probe
            periodSeconds: 5 # Probe interval
      # Volumes configuration
      volumes:
        - name: config-volume
          configMap:
            name: auth-server-config
---
# auth-server Service for internal communication
apiVersion: v1
kind: Service
metadata:
  name: auth-server
spec:
  selector:
    app: auth-server
  ports:
    - protocol: TCP
      port: 8081 # Service port
      targetPort: 8081 # Container port
      nodePort: 30082
  type: NodePort
